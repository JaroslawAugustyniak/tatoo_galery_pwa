services:
  mysql:
    image: mysql:8.0
    container_name: tattoogallery_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3312:3306"
    volumes:
      - tattoogallery_mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - default

  app:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    container_name: tattoogallery_app
    restart: unless-stopped
    working_dir: /web
    user: "${UID}:${GID}"
    volumes:
      - ./web:/web
      - ./uploads:/data/uploads
    command: sh -c "npm install && npx prisma migrate deploy && npm run dev"
    expose:
      - "3000"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      UPLOAD_DIR: /data/uploads
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ROOT_DOMAIN: tattoo.localhost
      npm_config_cache: /tmp/.npm
      NEXT_TELEMETRY_DISABLED: "1"
      VIRTUAL_HOST: tattoo.localhost,*.tattoo.localhost
      VIRTUAL_PORT: "3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
      - nginx-proxy-network

networks:
  nginx-proxy-network:
    external: true
    name: nginx-proxy-network

volumes:
  tattoogallery_mysql_data:
