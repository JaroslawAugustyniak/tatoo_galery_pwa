# Wspolna instancja MySQL serwera. Osobny projekt Compose (~/docker/mysql), niezalezny od aplikacji.
# Aplikacje dolaczaja do sieci "db-net" (external: true) i lacza sie z hostem "shared_mysql".
# Port 3310 jest przypiety TYLKO do 127.0.0.1 serwera (dostep z zewnatrz wylacznie tunelem SSH, np. Navicat).
# NIE zmieniaj na "3310:3306" - to wystawiloby baze do internetu.
# (Plik celowo ASCII-only: wklejanie znakow spoza ASCII przez terminal SSH psuje YAML.)
name: mysql

services:
  mysql:
    image: mysql:8.0
    container_name: shared_mysql
    restart: unless-stopped
    mem_limit: ${MYSQL_MEM_LIMIT:-768m}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?ustaw w .env}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --performance-schema=OFF
      --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-192M}
      --max-connections=100
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - shared_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - db

networks:
  db:
    name: db-net

volumes:
  shared_mysql_data:
